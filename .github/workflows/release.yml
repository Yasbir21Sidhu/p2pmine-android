name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the signed APK
        uses: actions/checkout@v4
        with:
          ref: apk-binaries
          path: prebuilt

      - name: Read release notes from this tag
        uses: actions/checkout@v4
        with:
          path: source

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' source/app/build.gradle.kts | head -1)
          apk="prebuilt/P2PMine-${version_name}.apk"
          notes="source/fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ ! -f "$apk" ] || [ ! -f "$notes" ]; then
            echo "Missing $apk or $notes"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "P2PMine ${version_name}" \
            --notes-file "$notes"
