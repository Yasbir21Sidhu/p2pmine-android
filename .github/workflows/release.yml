name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          apk="download/P2PMine-${version_name}.apk"
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ ! -f "$apk" ] || [ ! -f "$notes" ]; then
            echo "Missing $apk or $notes"
            ls -la download || true
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "P2PMine ${version_name}" \
            --notes-file "$notes"
