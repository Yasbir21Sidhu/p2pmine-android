name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Sign and publish
    # Skip when the upload key is not stored in GitHub. A tag can still
    # carry a release built on a trusted machine.
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Read version from Gradle
        run: |
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version_name}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName v${version_name}."
            echo "Bump versionName, then tag v<versionName>."
            exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ ! -f "$notes" ]; then
            echo "Missing changelog ${notes}"
            exit 1
          fi
          echo "version_name=${version_name}" >> "$GITHUB_ENV"
          echo "version_code=${version_code}" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p signing
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/p2pmine-upload.jks
          cat > signing/keystore.properties <<EOF
          storeFile=p2pmine-upload.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Name release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "P2PMine-${version_name}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "P2PMine-${version_name}.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "P2PMine-${version_name}.apk" \
            "P2PMine-${version_name}.aab" \
            --title "P2PMine ${version_name}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/${version_code}.txt"

      - name: Upload to Google Play internal track
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.p2pmine.app
          releaseFiles: P2PMine-${{ env.version_name }}.aab
          tracks: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

  publish-prebuilt:
    name: Publish signed APK
    # Used when the signed APK was built on a trusted machine and stored on apk-binaries.
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the signed APK
        uses: actions/checkout@v4
        with:
          ref: apk-binaries
          path: prebuilt

      - name: Read release notes from this tag
        uses: actions/checkout@v4
        with:
          path: source

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' source/app/build.gradle.kts | head -1)
          apk="prebuilt/P2PMine-${version_name}.apk"
          notes="source/fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ ! -f "$apk" ] || [ ! -f "$notes" ]; then
            echo "Missing $apk or $notes"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "P2PMine ${version_name}" \
            --notes-file "$notes"
