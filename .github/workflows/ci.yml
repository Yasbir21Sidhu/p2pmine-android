name: CI

# Manual only. An automatic build was emailing a failure on every update
# because GitHub's Android setup step is currently broken.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Unsigned release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace
